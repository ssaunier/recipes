name: Validate RecipeMD format

on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "scripts/validate.py"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "recipes/**"
      - "scripts/validate.py"
      - "requirements.txt"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: RecipeMD validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate recipes
        run: python scripts/validate.py
